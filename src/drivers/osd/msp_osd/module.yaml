module_name: MSP OSD
serial_config:
    - command: msp_osd start -d ${SERIAL_DEV}
      port_config_param:
        name: MSP_OSD_CONFIG
        group: OSD

parameters:
    - group: OSD
      definitions:

        # OSD Parameters
        OSD_SYMBOLS:
            description:
                short: OSD Symbol Selection
                long: |
                  Configure / toggle support display options.
            type: bitmask
            bit:
                0: CRAFT_NAME
                1: DISARMED
                2: GPS_LAT
                3: GPS_LON
                4: GPS_SATS
                5: GPS_SPEED
                6: HOME_DIST
                7: HOME_DIR
                8: MAIN_BATT_VOLTAGE
                9: CURRENT_DRAW
                10: MAH_DRAWN
                11: RSSI_VALUE
                12: ALTITUDE
                13: NUMERICAL_VARIO
                14: FLYMODE
                15: (unused) ESC_TMP
                16: (unused) PITCH_ANGLE
                17: (unused) ROLL_ANGLE
                18: CROSSHAIRS
                19: AVG_CELL_VOLTAGE
                20: (unused) HORIZON_SIDEBARS
                21: POWER
            default: 557055

        # OSD Crosshairs Vertical Position
        OSD_CH_HEIGHT:
            description:
                short: OSD Crosshairs Height
                long: |
                  Controls the vertical position of the crosshair display.
                  Resolution is limited by OSD to 15 discrete values. Negative
                  values will display the crosshairs below the horizon
            type: int32
            default: 0
            min: -8
            max: 8

        # OSD element positions. Coordinates are zero-based, with 26 columns
        # and 15 rows. The MSP position is calculated as 2048 + X + 32 * Y.
        OSD_CRAFT_X:
            description:
                short: OSD Craft Name X
            type: int32
            default: 16
            min: 0
            max: 25
        OSD_CRAFT_Y:
            description:
                short: OSD Craft Name Y
            type: int32
            default: 13
            min: 0
            max: 14
        OSD_DISARMED_X:
            description:
                short: OSD Disarmed X
            type: int32
            default: 13
            min: 0
            max: 25
        OSD_DISARMED_Y:
            description:
                short: OSD Disarmed Y
            type: int32
            default: 2
            min: 0
            max: 14
        OSD_FLYMODE_X:
            description:
                short: OSD Flight Mode X
            type: int32
            default: 11
            min: 0
            max: 25
        OSD_FLYMODE_Y:
            description:
                short: OSD Flight Mode Y
            type: int32
            default: 3
            min: 0
            max: 14
        OSD_GPS_LAT_X:
            description:
                short: OSD GPS Latitude X
            type: int32
            default: 0
            min: 0
            max: 25
        OSD_GPS_LAT_Y:
            description:
                short: OSD GPS Latitude Y
            type: int32
            default: 0
            min: 0
            max: 14
        OSD_GPS_LON_X:
            description:
                short: OSD GPS Longitude X
            type: int32
            default: 0
            min: 0
            max: 25
        OSD_GPS_LON_Y:
            description:
                short: OSD GPS Longitude Y
            type: int32
            default: 1
            min: 0
            max: 14
        OSD_GPS_SATS_X:
            description:
                short: OSD GPS Satellites X
            type: int32
            default: 0
            min: 0
            max: 25
        OSD_GPS_SATS_Y:
            description:
                short: OSD GPS Satellites Y
            type: int32
            default: 2
            min: 0
            max: 14
        OSD_GPS_SPEED_X:
            description:
                short: OSD GPS Speed X
            type: int32
            default: 13
            min: 0
            max: 25
        OSD_GPS_SPEED_Y:
            description:
                short: OSD GPS Speed Y
            type: int32
            default: 11
            min: 0
            max: 14
        OSD_HOME_DIST_X:
            description:
                short: OSD Home Distance X
            type: int32
            default: 15
            min: 0
            max: 25
        OSD_HOME_DIST_Y:
            description:
                short: OSD Home Distance Y
            type: int32
            default: 1
            min: 0
            max: 14
        OSD_HOME_DIR_X:
            description:
                short: OSD Home Direction X
            type: int32
            default: 13
            min: 0
            max: 25
        OSD_HOME_DIR_Y:
            description:
                short: OSD Home Direction Y
            type: int32
            default: 1
            min: 0
            max: 14
        OSD_BATT_VOLT_X:
            description:
                short: OSD Battery Voltage X
            type: int32
            default: 25
            min: 0
            max: 25
        OSD_BATT_VOLT_Y:
            description:
                short: OSD Battery Voltage Y
            type: int32
            default: 0
            min: 0
            max: 14
        OSD_CURRENT_X:
            description:
                short: OSD Current X
            type: int32
            default: 23
            min: 0
            max: 25
        OSD_CURRENT_Y:
            description:
                short: OSD Current Y
            type: int32
            default: 1
            min: 0
            max: 14
        OSD_MAH_DRAWN_X:
            description:
                short: OSD Consumed Capacity X
            type: int32
            default: 17
            min: 0
            max: 25
        OSD_MAH_DRAWN_Y:
            description:
                short: OSD Consumed Capacity Y
            type: int32
            default: 12
            min: 0
            max: 14
        OSD_RSSI_X:
            description:
                short: OSD RSSI X
            type: int32
            default: 13
            min: 0
            max: 25
        OSD_RSSI_Y:
            description:
                short: OSD RSSI Y
            type: int32
            default: 12
            min: 0
            max: 14
        OSD_ALTITUDE_X:
            description:
                short: OSD Altitude X
            type: int32
            default: 16
            min: 0
            max: 25
        OSD_ALTITUDE_Y:
            description:
                short: OSD Altitude Y
            type: int32
            default: 11
            min: 0
            max: 14
        OSD_CROSSHAIR_X:
            description:
                short: OSD Crosshair X
            type: int32
            default: 15
            min: 0
            max: 25
        OSD_CROSSHAIR_Y:
            description:
                short: OSD Crosshair Y
            type: int32
            default: 8
            min: 0
            max: 14
        OSD_CELL_VOLT_X:
            description:
                short: OSD Cell Voltage X
            type: int32
            default: 14
            min: 0
            max: 25
        OSD_CELL_VOLT_Y:
            description:
                short: OSD Cell Voltage Y
            type: int32
            default: 12
            min: 0
            max: 14
        OSD_POWER_X:
            description:
                short: OSD Power X
            type: int32
            default: 15
            min: 0
            max: 25
        OSD_POWER_Y:
            description:
                short: OSD Power Y
            type: int32
            default: 11
            min: 0
            max: 14


        # OSD Log Level
        OSD_LOG_LEVEL:
            description:
                short: OSD Warning Level
                long: |
                  Minimum security of log level to display on the OSD.
            type: int32
            bit:
                0: EMERGENCY
                1: ALERT
                2: CRITICAL
                3: ERROR
                4: WARNING
                5: NOTICE
                6: INFO
                7: DEBUG
                8: NONE
            default: 3

        # Scroll Speed
        OSD_SCROLL_RATE:
            description:
                short: OSD Scroll Rate (ms)
                long: |
                    Scroll rate in milliseconds for OSD messages longer than available character width.
                    This is lower-bounded by the nominal loop rate of this module.
            type: int32
            min: 100
            max: 1000
            default: 125

        # Dwell TIme
        OSD_DWELL_TIME:
            description:
                short: OSD Dwell Time (ms)
                long: |
                    Amount of time in milliseconds to dwell at the beginning of the display, when scrolling.
            type: int32
            min: 100
            max: 10000
            default: 500
