module_name: MSP OSD
serial_config:
    - command: msp_osd start -d ${SERIAL_DEV}
      port_config_param:
        name: MSP_OSD_CONFIG
        group: OSD

parameters:
    - group: OSD
      definitions:

        # OSD Parameters
        OSD_SYMBOLS:
            description:
                short: OSD Symbol Selection
                long: |
                  Configure / toggle support display options.
            type: bitmask
            bit:
                0: CRAFT_NAME
                1: DISARMED
                2: GPS_LAT
                3: GPS_LON
                4: GPS_SATS
                5: GPS_SPEED
                6: HOME_DIST
                7: (unused) HOME_DIR
                8: (unused) MAIN_BATT_VOLTAGE
                9: CURRENT_DRAW
                10: MAH_DRAWN
                11: RSSI_VALUE
                12: ALTITUDE
                13: (unused) NUMERICAL_VARIO
                # the following are reserved but not currently functional
                14: (unused) FLYMODE
                15: (unused) ESC_TMP
                16: PITCH_ANGLE
                17: ROLL_ANGLE
                18: CROSSHAIRS
                19: AVG_CELL_VOLTAGE
                20: (unused) HORIZON_SIDEBARS
                21: (unused) POWER
            default: 16383

        # OSD Crosshairs Vertical Position
        OSD_CH_POS_VER:
            description:
                short: OSD Crosshairs Vertical Position
                long: |
                  Controls the vertical position of the crosshair display.
                  Resolution is limited by OSD to 15 discrete values. Negative
                  values will display the crosshairs below the horizon
            type: int32
            default: 0
            min: -8
            max: 8

        # OSD Crosshairs Horizontal Position
        OSD_CH_POS_HOR:
            description:
                short: OSD Crosshairs Horizontal Position
                long: |
                  Controls the horizontal position of the crosshair display.
                  Resolution is limited by OSD to 15 discrete values. Negative
                  values will display the crosshairs left of the center of the screen
            type: int32
            default: 0
            min: -8
            max: 8


        # OSD Log Level
        OSD_LOG_LEVEL:
            description:
                short: OSD Warning Level
                long: |
                  Minimum security of log level to display on the OSD.
            type: int32
            bit:
                0: EMERGENCY
                1: ALERT
                2: CRITICAL
                3: ERROR
                4: WARNING
                5: NOTICE
                6: INFO
                7: DEBUG
                8: NONE
            default: 3

        # Scroll Speed
        OSD_SCROLL_RATE:
            description:
                short: OSD Scroll Rate (ms)
                long: |
                    Scroll rate in milliseconds for OSD messages longer than available character width.
                    This is lower-bounded by the nominal loop rate of this module.
            type: int32
            min: 100
            max: 1000
            default: 125

        # Dwell TIme
        OSD_DWELL_TIME:
            description:
                short: OSD Dwell Time (ms)
                long: |
                    Amount of time in milliseconds to dwell at the beginning of the display, when scrolling.
            type: int32
            min: 100
            max: 10000
            default: 500

        # RC Stick input
        OSD_RC_STICK:
            description:
                short: OSD RC Stick commands
                long: |
                    Forward RC stick input to VTX when disarmed
            type: int32
            min: 0
            max: 1
            default: 1

        OSD_MSG_X:
            description:
                short: Status and warning message X position
                long: |
                    DisplayPort column, increasing to the right, starting at zero at the top-left.
                    Choose a position within the connected display canvas, leaving room for the text.
                    Applied while running; no reboot required.
            type: int32
            default: 20
            min: 0
            max: 59

        OSD_MSG_Y:
            description:
                short: Status and warning message Y position
                long: |
                    DisplayPort row, increasing downward, starting at zero at the top-left.
                    Choose a position within the connected display canvas, leaving room for the text.
                    Applied while running; no reboot required.
            type: int32
